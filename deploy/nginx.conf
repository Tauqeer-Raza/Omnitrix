# Example internal deployment. Replace /srv/omnitrix/dist with your bundle path.
server {
    listen 8080;
    server_name _;
    root /srv/omnitrix/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { try_files $uri =404; expires 30d; }
    # Enable when FastAPI is available, and set VITE_API_MODE=http before build.
    # location /api/v1/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_buffering off;
    #     proxy_read_timeout 300s;
    #     client_max_body_size 20m;
    # }
}
