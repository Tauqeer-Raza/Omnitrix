services:
  backend:
    build: .
    env_file: .env
    # Only the local control-plane gateway can reach the API directly.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/srv/omnitrix/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  backend-data:
