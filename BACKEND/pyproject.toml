[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitrix-backend"
version = "0.1.0"
description = "Local OMNITRIX control plane and inference gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.41,<1", "pydantic-settings>=2.13,<3",
  "sqlalchemy>=2.0.48,<2.1", "httpx>=0.28.1,<1", "argon2-cffi>=25.1,<26",
  "python-multipart>=0.0.26,<1", "pypdf>=6.14.2,<7", "python-docx>=1.2,<2",
  "Pillow>=12.1.1,<13", "reportlab>=4.4,<5", "openpyxl>=3.1.5,<4",
  "python-pptx>=1.0.2,<2", "pypdfium2>=5,<6"
]
[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
